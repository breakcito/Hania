name: Deploy Hania Front

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hania-front-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar y construir
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Crear tarball
        run: tar -czf hania-front-${{ github.sha }}.tar.gz dist index.html package.json

      - name: Generar checksum
        run: sha256sum hania-front-${{ github.sha }}.tar.gz | awk '{print $1}' > hania-front-${{ github.sha }}.tar.gz.sha256

      - name: Subir al VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          scp hania-front-${{ github.sha }}.tar.gz hania-front-${{ github.sha }}.tar.gz.sha256 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_TARGET_DIR }}/

      - name: Disparar deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              ${{ secrets.VPS_DEPLOY_CMD }}
